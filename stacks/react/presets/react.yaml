# React + TypeScript 项目预设配置

# 项目信息
project:
  type: "web-frontend"
  subcategory: "spa"

# 技术栈
tech:
  frontend:
    framework: "react"
    language: "typescript"
    state: "zustand"
    router: "react-router"
    ui: "tailwind"
    build: "vite"

# 依赖版本
versions:
  react: "18.x"
  typescript: "5.x"
  zustand: "4.x"
  react-router: "6.x"
  vite: "5.x"
  tailwindcss: "3.x"

# 目录结构
structure:
  src:
    assets:
      - "images"
      - "fonts"
      - "styles"
    components:
      - "common"
      - "layout"
      - "business"
    pages:
      - "home"
      - "user"
      - "auth"
    hooks: []
    store:
      - "modules"
    router: []
    api:
      - "services"
      - "types"
    utils: []
    constants: []
    types: []
    services: []
  public:
    - "favicon.ico"
    - "images"

# 状态管理规范
state_management:
  solution: "zustand"
  patterns:
    - "Store pattern"
    - "Selector pattern"
    - "Persist middleware"

# 路由规范
routing:
  solution: "react-router"
  features:
    - "Lazy loading"
    - "Route guards"
    - "Nested routes"

# 代码规范
code_style:
  naming:
    components: "PascalCase"
    hooks: "use + PascalCase"
    variables: "camelCase"
    constants: "UPPER_SNAKE_CASE"
    files: "camelCase"

  structure:
    max_file_lines: 300
    max_function_lines: 40
    max_parameters: 4

# 组件规范
components:
  style: "functional"
  patterns:
    - "Custom hooks"
    - "Compound components"
    - "Render props"

  structure:
    - "Props interface"
    - "Component definition"
    - "Styles"
    - "Export"

# 测试规范
testing:
  unit: "vitest"
  e2e: "playwright"
  component: "testing-library"
  coverage_target: 80

# 构建规范
build:
  commands:
    dev: "npm run dev"
    build: "npm run build"
    preview: "npm run preview"

  output: "dist/"
  sourcemap: true

# 环境变量
environment:
  files:
    - ".env.development"
    - ".env.production"
  prefix: "VITE_"
  required:
    - "VITE_API_URL"

# 禁止事项
forbidden:
  - "使用 any 类型"
  - "在组件中直接修改 state"
  - "内联样式 (使用 Tailwind)"
  - "console.log (生产环境)"

# 必须遵守
required:
  - "所有组件必须有 TypeScript 类型"
  - "使用自定义 hooks 抽象逻辑"
  - "API 调用统一错误处理"
  - "敏感信息使用环境变量"
