# 海洋数据预测 - PyTorch LSTM 项目预设
# Ocean Data Prediction with PyTorch LSTM

# ============================================================
# 基础信息
# ============================================================
project:
  name: "OceanLSTM"
  description: "海洋数据预测系统，使用 LSTM 模型从数据库读取数据并预测"
  version: "0.0.1"

# ============================================================
# 项目类型
# ============================================================
type:
  category: "cli"                 # 命令行工具 / 脚本项目
  subcategory: "ml-pipeline"      # 机器学习管道

# ============================================================
# 技术栈配置
# ============================================================
tech:
  ml:
    framework: "pytorch"          # PyTorch 深度学习框架
    model: "lstm"                 # LSTM 模型
    language: "python"            # Python 3.8+

  database:
    type: "postgresql"            # 数据库类型 (可替换为 mysql/sqlserver)
    connector: "sqlalchemy"       # 数据库连接器

  data:
    processing: "pandas"          # 数据处理
    numerical: "numpy"            # 数值计算

# ============================================================
# 模块结构 (五模块架构)
# ============================================================
modules:
  - name: "read"
    description: "数据库读取模块"
    responsibility: "从数据库读取原始海洋数据"
  - name: "preprocess"
    description: "数据预处理模块"
    responsibility: "数据清洗、归一化、特征工程"
  - name: "model"
    description: "模型定义模块"
    responsibility: "LSTM 网络结构定义"
  - name: "train"
    description: "模型训练模块"
    responsibility: "训练循环、损失计算、优化器"
  - name: "predict"
    description: "预测输出模块"
    responsibility: "模型推理、结果写回数据库"

# ============================================================
# 特殊需求
# ============================================================
requirements:
  features:
    - "从数据库读取海洋监测数据"
    - "使用 LSTM 进行时序预测"
    - "预测结果写回数据库"
    - "支持批量预测和单次预测"

  non_functional:
    performance: "支持大数据集训练，支持 GPU 加速"
    security: ["数据库连接加密", "敏感信息环境变量管理"]

# ============================================================
# 约束条件
# ============================================================
constraints:
  compatibility:
    - "Python 3.8+"
    - "支持 CUDA 11.0+ (GPU 训练)"

  limits:
    memory: "训练时内存使用 < 16GB"

# ============================================================
# 开发偏好
# ============================================================
preferences:
  style:
    indent: 4
    quotes: "double"
    max_line_length: 120

  testing:
    unit_framework: "pytest"
    coverage_target: 70

# ============================================================
# 环境配置
# ============================================================
environments:
  development:
    db_host: "localhost"
    debug: true
    device: "cpu"

  production:
    db_host: "${DB_HOST}"
    debug: false
    device: "cuda"
